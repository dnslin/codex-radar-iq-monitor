<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Radar IQ</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="radar-mark" aria-hidden="true"></span>
        <div>
          <h1>Codex Radar IQ</h1>
          <p id="status-text" role="status">正在读取数据…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button
          id="theme-button"
          class="theme-button"
          type="button"
          aria-label="切换主题"
          title="主题：自动"
        >
          <span id="theme-icon" class="theme-icon" aria-hidden="true">◐</span>
          <span id="theme-label">自动</span>
        </button>
        <button id="refresh-button" class="refresh-button" type="button">
          <span class="refresh-icon" aria-hidden="true">↻</span>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <main>
      <section id="error-banner" class="error-banner" role="alert" hidden></section>

      <section class="overview" aria-labelledby="overview-title">
        <div class="section-heading">
          <div>
            <h2 id="overview-title">模型总览</h2>
            <p>所有思考等级的加权 IQ · 展开模型查看详情</p>
          </div>
          <span id="dataset-meta" class="dataset-meta"></span>
        </div>
        <div class="filters" role="search" aria-label="筛选模型">
          <label class="search-field">
            <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
              <circle cx="8.5" cy="8.5" r="5.5" />
              <path d="m13 13 4 4" />
            </svg>
            <input id="model-search" type="search" aria-label="搜索模型或运行工具" placeholder="搜索模型或运行工具" autocomplete="off" />
          </label>
          <label class="filter-select">
            <span class="sr-only">运行工具</span>
            <select id="runtime-filter">
              <option value="">全部运行工具</option>
            </select>
          </label>
          <label class="filter-select sort-select">
            <span class="sr-only">排序方式</span>
            <select id="model-sort">
              <option value="iq">IQ 从高到低</option>
              <option value="site">源站顺序</option>
              <option value="name">模型名称</option>
            </select>
          </label>
        </div>
        <div class="list-heading row-layout" aria-hidden="true">
          <span id="result-count">模型 / 运行工具</span>
          <span>总体 IQ</span>
          <span>样本</span>
          <span title="与上次成功获取的快照对比">较上次</span>
          <span></span>
        </div>
        <div id="model-scroll" class="model-scroll" tabindex="0" role="region" aria-label="模型列表">
          <div id="model-list" class="model-list"></div>
          <div id="empty-state" class="empty-state" hidden>
            <strong id="empty-title">正在获取模型数据…</strong>
            <p id="empty-description">首次获取可能需要几秒钟。</p>
            <button id="clear-filters" class="text-button" type="button" hidden>清空筛选</button>
          </div>
        </div>
        <p id="results-status" class="sr-only" role="status"></p>
      </section>

      <details class="settings-panel">
        <summary>监听设置</summary>
        <div class="settings-grid">
          <label>
            <span>刷新间隔</span>
            <select id="refresh-minutes">
              <option value="5">5 分钟</option>
              <option value="15">15 分钟</option>
              <option value="30">30 分钟</option>
              <option value="60">1 小时</option>
            </select>
          </label>

          <label class="toggle-row">
            <span>分数变化通知</span>
            <input id="notifications-enabled" type="checkbox" />
          </label>

          <label>
            <span>通知阈值</span>
            <span class="number-field">
              <input
                id="notification-threshold"
                type="number"
                min="0"
                max="20"
                step="0.5"
                inputmode="decimal"
              />
              <b>IQ</b>
            </span>
          </label>
        </div>
        <p id="settings-status" class="settings-status"></p>
      </details>
    </main>

    <footer>
      <span id="source-time">尚未获取数据</span>
      <a href="https://deng.codexradar.com/" target="_blank" rel="noreferrer">打开源站</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
